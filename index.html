  <link rel="preconnect" href="https://googleapis.com">

  <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{font-family:Inter,Arial,sans-serif;color:#eaf5ff;background:#04162f;font-synthesis:none;text-rendering:optimizeLegibility;scroll-behavior:smooth;--cyan:#00c7ff;--blue:#168cff;--navy:#04162f;--muted:#a7c6e8;--line:rgba(46,157,255,.25)}
    *{box-sizing:border-box}body{margin:0}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}.site-shell{overflow:hidden;background:linear-gradient(135deg,#04152c,#05264c 55%,#03152d)}
    .topbar{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,5vw,64px);gap:24px;background:rgba(3,21,47,.96);border-bottom:1px solid rgba(0,195,255,.38);position:sticky;top:0;z-index:20;backdrop-filter:blur(18px)}
    .brand{display:flex;align-items:center;gap:13px;min-width:270px}.brand-mark{font-size:31px;font-weight:800;letter-spacing:-3px;color:#00bfff;text-shadow:0 0 25px #008dff}.brand b{display:block;font-size:15px}.brand small{display:block;color:#b5d1ef;font-size:10px;margin-top:3px}

    .resume-top{display:flex;align-items:center;gap:8px;border:1px solid var(--cyan);color:white;background:transparent;border-radius:30px;padding:10px 15px;font-size:11px;white-space:nowrap}.resume-top:hover,.btn.outline:hover{background:rgba(0,190,255,.12)}.menu-toggle{display:none;background:none;border:0;color:white;font-size:25px}
    .hero{position:relative;min-height:420px;padding:38px clamp(24px,5.3vw,70px) 24px;display:flex;align-items:center;border-bottom:1px solid var(--line);isolation:isolate;background:radial-gradient(ellipse at 67% 44%,rgba(0,125,255,.43),transparent 38%),linear-gradient(110deg,#04152d 5%,#06366c 63%,#041b3d)}
    .hero-grid{position:absolute;inset:0;z-index:-1;opacity:.28;background-image:linear-gradient(120deg,transparent 30%,rgba(0,165,255,.2) 30.2%,transparent 30.6%),linear-gradient(60deg,transparent 60%,rgba(0,165,255,.17) 60.2%,transparent 60.5%);background-size:280px 230px}
    .hero-glow{position:absolute;z-index:-1;left:38%;top:8%;width:380px;height:340px;border-radius:50%;background:#087bff;filter:blur(100px);opacity:.18}
    .hero-copy{width:54%;max-width:610px;z-index:2}.eyebrow{color:var(--cyan);font-weight:700;font-size:15px;margin:0 0 4px}.hero h1{font-size:clamp(38px,4.6vw,63px);line-height:1.08;letter-spacing:-2.5px;margin:0 0 8px;color:#f6fbff}.hero h1 span{color:#18baff}.hero h2{font-size:clamp(16px,1.65vw,21px);margin:0 0 12px;font-weight:600}.hero-intro{font-size:13px;line-height:1.65;color:#d4e7fa;max-width:465px;margin:0}
    .hero-actions{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:12px 20px;border-radius:28px;font-weight:600;font-size:12px;border:1px solid transparent}.btn.primary{background:linear-gradient(100deg,#078cff,#00b9ff);color:white;box-shadow:0 7px 24px rgba(0,130,255,.22)}.btn.primary:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,160,255,.35)}.btn.outline{border-color:#e8f5ff;background:rgba(2,19,44,.25);color:#fff}
    .stats{display:flex;gap:0;margin-top:28px;max-width:500px}.stats div{display:grid;grid-template-columns:23px auto;column-gap:7px;padding:0 16px;border-right:1px solid rgba(0,194,255,.55)}.stats div:first-child{padding-left:0}.stats div:last-child{border:0}.stats .stat-icon{color:var(--cyan);font-size:18px;grid-row:span 2}.stats strong{font-size:14px}.stats small{font-size:9px;color:#c0d8f1;white-space:nowrap}
    .hero-person{position:absolute;bottom:0;left:47%;height:94%;width:30%;display:flex;align-items:flex-end;justify-content:center;z-index:1;pointer-events:none}.portrait-img{height:100%;width:100%;object-fit:cover;object-position:61% 8%;border-radius:42% 42% 0 0 / 24% 24% 0 0;mask-image:linear-gradient(to bottom,#000 0%,#000 84%,transparent 100%);filter:drop-shadow(0 0 28px rgba(0,145,255,.18))}
    .tech-orbit{position:absolute;right:4.5%;top:11%;width:18%;height:78%;display:grid;grid-template-columns:1fr 1fr;align-items:center;justify-items:center;color:#00d6ff}.tech-bubble{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;background:rgba(0,176,255,.15);border:1px solid rgba(0,208,255,.5);box-shadow:0 0 18px rgba(0,174,255,.2)}.tech-bubble.sp{border-radius:12px;background:#007c99;color:#fff;font-size:25px}.tech-bubble.net{color:#e7f7ff}.tech-react{font-size:54px}.tech-power{font-size:49px;color:#cf7dff}.tech-teams{font-size:28px;font-weight:800;background:#5846d9;color:#fff;padding:6px 12px;border-radius:10px}.tech-azure{font-size:48px;font-weight:800;color:#29a9ff}.tech-orbit p{font-size:19px;font-style:italic;line-height:1.25;color:#00d7ff;transform:rotate(-8deg);font-weight:600}
    .section-wrap{width:min(1240px,91%);margin:auto}.intro-section{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(32px,6vw,76px);padding-top:30px;padding-bottom:28px;border-bottom:1px solid var(--line)}.section-title{margin-bottom:18px}.section-title h2{font-size:21px;letter-spacing:-.4px;margin:0 0 8px;color:#f2f8ff}.section-title span{display:block;width:38px;height:3px;border-radius:4px;background:linear-gradient(90deg,var(--cyan),#168cff)}
    .about-copy>p{font-size:12px;line-height:1.7;color:#d0e3f8;margin:0 0 12px}.contact-list{display:grid;gap:9px;margin-top:16px}.contact-list a{display:flex;align-items:center;gap:12px;font-size:12px;color:#d8eaff}.contact-list a:hover{color:var(--cyan)}.contact-list .contact-icon{width:27px;height:27px;display:grid;place-items:center;border-radius:50%;background:#078df2;color:white;font-weight:700}
    .skills-panel{padding:19px 20px 17px;border:1px solid rgba(41,157,255,.24);border-radius:13px;background:linear-gradient(145deg,rgba(10,55,98,.65),rgba(2,24,52,.8));box-shadow:inset 0 1px rgba(255,255,255,.025)}.skills-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px 17px}.skill{display:flex;align-items:center;gap:11px;min-width:0}.skill-icon{width:30px;height:30px;flex-shrink:0;display:grid;place-items:center;border-radius:9px;font-size:13px;font-weight:800;background:rgba(0,171,255,.15);color:#20d6ff}.skill-icon.power{color:#e18aff;font-size:25px}.skill-icon.dotnet{border-radius:50%;background:#4539bf;color:#fff;font-size:10px}.skill-icon.js{background:#f3c928;color:#15233c}.skill-icon.html{background:#168aff;color:white;font-size:19px}.skill-icon.database{color:#2ebaff}.skill-icon.vs{color:#24b9ff}.skill b{display:block;font-size:10px;font-weight:600;color:#f1f8ff}.skill small{display:block;font-size:9px;line-height:1.45;color:#a9c9e9;margin-top:3px}
    .experience-section{padding-top:24px;padding-bottom:30px}.timeline{position:relative;display:grid;gap:24px;margin-left:9px}.timeline:before{content:"";position:absolute;left:-1px;top:25px;bottom:20px;width:2px;background:linear-gradient(var(--cyan),#087bff)}.job-card{position:relative;margin-left:17px;display:grid;grid-template-columns:1fr 1.3fr;gap:20px;padding:17px 19px;border:1px solid rgba(33,145,255,.28);border-radius:11px;background:linear-gradient(100deg,rgba(5,37,72,.74),rgba(3,26,56,.56));transition:transform .2s,border-color .2s}.job-card:hover{transform:translateX(3px);border-color:rgba(0,198,255,.65)}.timeline-dot{position:absolute;left:-24px;top:21px;width:14px;height:14px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 4px #052448}
    .job-meta{display:flex;flex-direction:column;gap:4px}.job-title{font-size:15px;font-weight:700;color:#fff;margin:0}.job-company{font-size:12px;color:var(--cyan);font-weight:600}.job-duration{font-size:10px;color:var(--muted)}.job-details{font-size:12px;line-height:1.65;color:#d0e3f8}.job-details ul{margin:0;padding-left:16px}.job-details li{margin-bottom:6px}
    @media(max-width:768px){.intro-section,.job-card{grid-template-columns:1fr}.hero-copy{width:100%}.hero-person,.tech-orbit{display:none}}
  </style>
</head>
